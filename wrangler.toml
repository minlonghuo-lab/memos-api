# ========================================
# Cloudflare-Memos 后端 API 服务配置
# ========================================

name = "memos-api"
main = "src/server/index.js"
compatibility_date = "2024-01-15"
compatibility_flags = ["nodejs_compat"]

# React 构建产物与 API 由同一个 Worker 提供。
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
# 时区配置（IANA 时区数据库格式）
# 示例: "Asia/Shanghai", "America/New_York", "Europe/London"
# 留空则使用 UTC
TIMEZONE = "Asia/Shanghai"

# JWT_SECRET 不要写在这里。
# 本地开发请放到根目录 .dev.vars
# 部署环境请使用: wrangler secret put JWT_SECRET

# ========================================
# 数据库配置
# ========================================
[[d1_databases]]
binding = "DB"
database_name = "memos_db"
database_id = "5ee1cb8f-0f6e-46ec-9f46-c2cfaec645e1"

# ========================================
# 对象存储配置
# ========================================
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "memos"
